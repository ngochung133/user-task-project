spring:
  application:
    name: hr-management
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hr-managerment}?createDatabaseIfNotExist=true"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:}"
  flyway:
    #bật flyway
    enabled: true
    #địa điểm file code
    locations: classpath:db/migration
    #false tắt baseline, true bật baseline, nếu có db mà chưa có history => false báo lỗi, phải dùng true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        # true để bắt đầu từ trang 1, false để bắt đầu từ trang 0.
        one-indexed-parameters: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: "${JWT_SECRET}"
  # 15 phút (ms)
  access-token-expiration: 900000
  # 7 ngày (ms)
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  upload:
    base-dir: ./uploads
    max-file-size: 8242880
    allowed-extensions: [jpg, jpeg, png, gif, webp]
    allowed-folders: [avatars, logos]

  #quyết định có tạo một Spring Bean hay khong
  seed:
    enabled: false
  ## luu token vao local storage
springdoc:
  swagger-ui:
    persist-authorization: true
    enabled: true
